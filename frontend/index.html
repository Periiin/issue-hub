<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Issue Hub · 甲方问题跟踪</title>

    <!-- PWA：加到手机桌面后像原生 App 一样打开 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS 不读 manifest 的 icon，需要单独的 apple-touch-icon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Issue Hub" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      html, body, #app { height: 100%; margin: 0; }
      body {
        background: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 注册 service worker：只在 https 或 localhost 下生效，http 局域网访问会被浏览器跳过
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* 注册失败不影响正常使用 */
          });
        });
      }
    </script>
  </body>
</html>
